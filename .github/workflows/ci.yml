name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Flake check
        run: nix flake check
      - name: Format
        run: nix run .#format-check
      - name: Static checks
        run: nix run .#check
      - name: Rust tests
        run: nix run .#test-rust
      - name: Web tests
        run: nix run .#test-web

  macos-host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: macOS host tests
        run: nix run .#test-macos

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Secret and dependency audit
        run: nix run .#security-audit
